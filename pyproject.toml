[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mineru-mcp"
version = "0.1.0"
description = "Standalone MinerU document parsing MCP service"
requires-python = ">=3.10"

[tool.hatch.build.targets.wheel]
include = ["*.py"]
dependencies = [
    "fastmcp>=2.0",
    "uvicorn[standard]>=0.30",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
