[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mineru-mcp"
version = "0.1.0"
description = "Standalone MinerU document parsing MCP service"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "uvicorn[standard]>=0.30",
    # MinerU is installed separately via conda/pip from the official repo
    # magic-pdf[full] or magic-pdf[lite] — not listed here to avoid version conflicts
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
